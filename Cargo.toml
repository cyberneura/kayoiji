[workspace]
resolver = "2"
members = ["crates/kayoiji-core", "crates/kayoiji-cli", "src-tauri", "pad/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
kayoiji-core = { path = "crates/kayoiji-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
