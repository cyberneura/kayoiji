[workspace]
resolver = "2"
members = ["crates/kayoiji-core", "crates/kayoiji-check", "crates/kayoiji-cli", "crates/kayoiji-windows", "src-tauri", "pad/src-tauri"]

[workspace.package]
version = "0.8.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
kayoiji-core = { path = "crates/kayoiji-core" }
kayoiji-check = { path = "crates/kayoiji-check" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
