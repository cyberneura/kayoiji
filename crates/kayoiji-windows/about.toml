# cargo-about の設定。scripts/generate-third-party-notices.sh が読む。
# Windows 版の DLL (64 bit と 32 bit) に入るクレートだけを対象にする。ビルドとテストだけで使う依存は除く。
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
targets = ["x86_64-pc-windows-msvc", "i686-pc-windows-msvc"]

# Kayoiji 自身のクレート (publish = false) は載せない。
[private]
ignore = true
