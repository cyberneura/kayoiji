[package]
name = "kayoiji-pad"
description = "A text area for trying and tuning the Kayoiji engine"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
# Windows では bin と lib が同じ名前だと衝突するので、lib に接尾辞を付ける。
name = "kayoiji_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
kayoiji-core.workspace = true
kayoiji-check.workspace = true
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
