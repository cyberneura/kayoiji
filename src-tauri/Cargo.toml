[package]
name = "kayoiji"
description = "Modeless Japanese/English input method for macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Windows では bin と lib が同じ名前だと衝突するので、lib に接尾辞を付ける。
name = "kayoiji_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
kayoiji-core.workspace = true
kayoiji-check.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-input-method-kit = "0.3"
